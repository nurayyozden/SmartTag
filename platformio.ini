[platformio]
default_envs = nfc_station ; change this value then upload
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Libraries are downloaded automatically on the first build, so the project
; builds on any computer (no local Arduino libraries folder needed).
lib_deps =
    ; Seeed PN532 driver (I2C), pinned to a known commit of its arduino branch.
    ; It also pulls in its NDEF dependency automatically.
    https://github.com/Seeed-Studio/PN532.git#e61296876c1c3e66ef67156562c71324b389f5fa
    madhephaestus/ESP32Servo@^3.2.1

[env:tag_reader]
build_src_filter = -<*> +<tag_reader/*>

[env:testing_connection]
build_src_filter = -<*> +<testing_connection/*>

[env:nfc_reader]
build_src_filter = -<*> +<nfc_reader/*>

[env:nfc_station]
; WRITE mode (tagging station) + SORT mode in one firmware. See src/nfc_station/README.md
build_src_filter = -<*> +<nfc_station/*>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@^7
